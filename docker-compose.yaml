services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingestion_service:
    build: ./ingestion_service
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  consumer_service:
    build: ./consumer_service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: metricflow
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      ingestion_service:
        condition: service_started
    restart: on-failure

  query_service:
    build: ./query_service
    ports:
      - "8001:8001"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: metricflow
    depends_on:
      mongo:
        condition: service_healthy

  nginx_service:
    build: ./nginx_service
    ports:
      - "80:80"
    depends_on:
      - ingestion_service
      - query_service

  # Run on demand: docker compose run --rm generator_service
  generator_service:
    build: ./generator_service
    profiles: ["tools"]
    environment:
      TARGET_URL: http://nginx_service
      BATCH_SIZE: "25"
    depends_on:
      - nginx_service

volumes:
  rabbitmq_data:
  mongo_data:
