events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    upstream ingestion {
        # "ingestion_service" is the compose service name, resolved by Docker DNS.
        server ingestion_service:8000;
    }

    upstream query {
        server query_service:8001;
    }

    server {
        listen 80;

        client_max_body_size 10m;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Query UI, served at /ui (trailing slash strips the prefix upstream).
        location = /ui {
            return 301 /ui/;
        }

        location /ui/ {
            proxy_pass http://query/;
        }

        # Read API.
        location /api/ {
            proxy_pass http://query/api/;
        }

        location /health {
            access_log off;
            proxy_pass http://ingestion/health;
        }

        # Write path: POST /logs and /metrics.
        location / {
            proxy_pass http://ingestion;
        }
    }
}
